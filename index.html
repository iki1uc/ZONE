<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ZONE · Master‑Index · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:40px; }
h1 { color:#0ff; text-shadow:0 0 14px #0ff; text-align:center; margin-bottom:40px; }
.panel { background:#111; border-left:4px solid #0ff; padding:22px; margin-bottom:35px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; padding:15px; border-left:3px solid #6cf; white-space:pre-wrap; }
a { color:#0ff; font-size:18px; display:block; margin:6px 0; text-decoration:none; }
a:hover { color:#9ef; }
</style>

<script type="module">

import { CLOCK_ENGINE } from "./CLOCK.engine.js";
import { OC } from "./OC.js";

let ZONE_CLOCK = 0;

setInterval(()=>{
    ZONE_CLOCK++;

    const engine = CLOCK_ENGINE(ZONE_CLOCK);
    const oc     = OC(ZONE_CLOCK);

    updatePanels(engine, oc);

}, 111);

function panelZone(){
return `
ZONE · Raum‑Ebene
ZONE.clock = ${ZONE_CLOCK}

Schichten:
• WELT.zone  – Welt
• UNI.zone   – Universum
• ZONE.layer – Layer
• ZONE.room  – Räume
• ZONE.portal – Übergänge
• ZONE.scan  – Scan
• ZONE.sync  – Sync

CHAIN:
iki → bir → uc → iki1uc → CLOCK → TIME → RESPO → ZONE → USER.use
`;
}

function panelEngine(engine){
return `
CLOCK.engine
${JSON.stringify(engine, null, 2)}
`;
}

function panelOC(oc){
return `
OC.js
${JSON.stringify(oc, null, 2)}
`;
}

function updatePanels(engine, oc){
    document.getElementById("zone").textContent = panelZone();
    document.getElementById("engine").textContent = panelEngine(engine);
    document.getElementById("oc").textContent = panelOC(oc);
}

</script>

</head>

<body>

<h1>ZONE · Master‑Index · iki1uc</h1>

<div class="panel"><div class="title">ZONE</div><pre id="zone"></pre></div>
<div class="panel"><div class="title">ENGINE</div><pre id="engine"></pre></div>
<div class="panel"><div class="title">OC.js</div><pre id="oc"></pre></div>

</html>
